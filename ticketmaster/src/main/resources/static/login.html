<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - TrackTicket</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <!-- Single shared stylesheet — same one the workspace uses, so sign-in -->
    <!-- is unmistakably the same product rather than a separately-styled page. -->
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .ethereal-bg {
            position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(circle at 15% 20%, var(--tm-cyan-100) 0%, rgba(202,240,248,0) 45%),
                radial-gradient(circle at 85% 80%, var(--g-blue-light) 0%, rgba(228,243,250,0) 50%);
        }

        .login-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
        }

        .g-card { width: 100%; max-width: 420px; }

        .auth-header { text-align: center; margin-bottom: 32px; }
        .auth-header img { margin: 0 auto 16px; }
        .auth-header h1 {
            font-family: var(--font-display);
            font-size: 24px; font-weight: 700; margin: 0 0 6px;
            color: var(--g-text-main);
        }
        .auth-header p { margin: 0; font-size: 14px; color: var(--g-text-muted); }

        .action-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 28px;
        }
        .action-row a {
            color: var(--g-blue-dark); font-weight: 500; font-size: 14px; text-decoration: none;
        }
        .action-row a:hover { text-decoration: underline; }

        #errorContainer .error-banner {
            display: flex; align-items: center; gap: 10px;
            font-size: 13.5px; line-height: 1.4;
            padding: 12px 14px; border-radius: 10px;
            background: var(--g-red-bg); color: var(--g-red);
            margin-bottom: 20px;
        }
        #errorContainer .error-banner.success {
            background: var(--g-green-bg); color: var(--g-green);
        }

        .auth-footnote {
            text-align: center; margin-top: 24px; font-size: 12.5px; color: var(--g-text-faint);
        }
    </style>
</head>
<body>

<div class="ethereal-bg" aria-hidden="true"></div>

<div class="login-wrapper">
    <div class="g-card">

        <div class="auth-header">
            <img src="/images/logo.png" alt="TrackTicket logo" style="width: 44px; height: 44px;">
            <h1>Sign in</h1>
            <p>Use your Enterprise Account</p>
        </div>

        <div id="errorContainer" style="display: none;">
            <div class="error-banner" id="errorBanner">
                <span class="material-symbols-rounded" style="font-size: 20px;" aria-hidden="true" id="errorIcon">error</span>
                <span id="errorMessage">Invalid credentials.</span>
            </div>
        </div>

        <div class="g-input-group" id="usernameGroup">
            <input type="text" id="username" placeholder=" " required autocomplete="off" aria-label="Enterprise Username">
            <label for="username">Enterprise Username</label>
        </div>

        <div class="g-input-group" id="passwordGroup">
            <input type="password" id="password" placeholder=" " required autocomplete="off" aria-label="Password">
            <label for="password">Enter your password</label>
        </div>

        <!-- MFA step: hidden until the server tells us the account requires it -->
        <div class="g-input-group" id="mfaCodeGroup" style="display:none;">
            <input type="text" id="mfaCode" placeholder=" " inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-label="6-digit authentication code">
            <label for="mfaCode">6-digit authenticator code</label>
        </div>

        <div class="action-row">
            <a href="#" onclick="showForgotPassword(event)">Forgot password?</a>
            <button class="tm-btn tm-btn-primary" onclick="login()" id="loginSubmitBtn">Next</button>
        </div>

        <p class="auth-footnote">Trouble signing in? Contact your workspace administrator.</p>

    </div>
</div>

<script>
    document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') login();
    });

    let pendingMfaToken = null;

    function showError(message, isSuccess) {
        const errContainer = document.getElementById('errorContainer');
        const banner = document.getElementById('errorBanner');
        const icon = document.getElementById('errorIcon');
        document.getElementById('errorMessage').innerText = message;
        banner.classList.toggle('success', !!isSuccess);
        icon.innerText = isSuccess ? 'check_circle' : 'error';
        errContainer.style.display = 'block';
    }

    async function login() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        document.getElementById('errorContainer').style.display = 'none';

        if (pendingMfaToken) {
            const code = document.getElementById('mfaCode').value.trim();
            if (!code) { showError('Enter your 6-digit code.'); return; }
            try {
                const res = await fetch('/api/auth/login/mfa-verify', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
                    body: JSON.stringify({ mfaToken: pendingMfaToken, code })
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('jwt_username', data.username);
                    localStorage.setItem('jwt_role', data.role);
                    window.location.href = '/index.html';
                } else {
                    showError('Invalid or expired code.');
                }
            } catch (e) {
                showError("Couldn't connect to server.");
            }
            return;
        }

        if (!user || !pass) {
            showError('Enter a username and password.');
            return;
        }

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
                body: JSON.stringify({ username: user, password: pass })
            });

            if (response.ok) {
                const data = await response.json();
                if (data.mfaRequired) {
                    pendingMfaToken = data.mfaToken;
                    document.getElementById('mfaCodeGroup').style.display = 'block';
                    document.getElementById('passwordGroup').style.display = 'none';
                    document.getElementById('mfaCode').focus();
                    return;
                }
                localStorage.setItem('jwt_username', data.username);
                localStorage.setItem('jwt_role', data.role);
                window.location.href = '/index.html';
            } else {
                showError('Wrong password. Try again.');
            }
        } catch (error) {
            showError("Couldn't connect to server.");
        }
    }

    function showForgotPassword(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const name = username || prompt('Enter your username:');
        if (!name) return;

        fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: name })
        })
            .then(r => r.json())
            .then(data => showError(data.message, true))
            .catch(() => showError("Couldn't connect to server."));
    }
</script>
</body>
</html>
